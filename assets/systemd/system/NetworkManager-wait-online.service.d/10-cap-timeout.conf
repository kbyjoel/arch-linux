# Pendant du drop-in systemd-networkd-wait-online, pour les machines installées
# avec NetworkManager. Même objectif : empêcher l'attente réseau du démarrage de
# retarder graphical.target, et donc le lancement de Hyprland par uwsm.
#
# L'unité amont expose son délai via une variable d'environnement :
#   ExecStart=/usr/bin/nm-online -s -q
#   Environment=NM_ONLINE_TIMEOUT=60
# On surcharge donc la variable plutôt que l'ExecStart — c'est le point d'entrée
# prévu par NetworkManager, et ça résiste à un changement de chemin ou d'options
# en amont, contrairement à une réécriture complète de la ligne de commande.
#
# NetworkManager ne souffre pas de la pathologie exacte de systemd-networkd (il
# libère un lien WiFi non associé au lieu de l'attendre sans fin), mais il
# alimente le même network-online.target : la chaîne de blocage reste identique.
[Service]
Environment=NM_ONLINE_TIMEOUT=10
