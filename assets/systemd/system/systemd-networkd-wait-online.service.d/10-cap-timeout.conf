# Plafonne l'attente réseau au démarrage, pour les machines installées avec
# systemd-networkd. Voir la section « Drop-ins systemd » d'install.sh pour la
# chaîne complète qui mène à l'écran noir après le login.
#
# --any : le système est considéré en ligne dès qu'UNE interface l'est, au lieu
#   d'exiger que TOUTES les interfaces requises le soient. Décisif avec les
#   fichiers 20-*.network de l'ISO Arch, qu'archinstall recopie sur la cible :
#   ils posent RequiredForOnline=routable sur toute carte de type wlan. Or
#   systemd-networkd ne fait que l'adressage, il n'associe pas le WiFi — sans
#   supplicant (iwd, wpa_supplicant), une carte WiFi reste NO-CARRIER pour
#   toujours et cet état « routable » n'arrive jamais.
#
# --timeout=10 : filet de sécurité si vraiment aucune interface n'est en ligne.
#   Le défaut amont est de 120 s, soit à lui seul plus du double du budget dont
#   uwsm dispose avant d'abandonner l'attente de graphical.target.
[Service]
ExecStart=
ExecStart=/usr/lib/systemd/systemd-networkd-wait-online --any --timeout=10
