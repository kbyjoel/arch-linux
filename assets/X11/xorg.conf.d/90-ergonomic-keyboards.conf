# Claviers ergonomiques en disposition fr / variante ergol pour l'ÉCRAN DE
# CONNEXION (SDDM).
#
# POURQUOI CE FICHIER EXISTE
# SDDM démarre son propre serveur X (voir « Running: /usr/bin/X ... vt2 » dans le
# journal de boot) et ne lit évidemment pas la config de Hyprland, qui n'est
# chargée qu'après le login. Sans ce fichier, le greeter applique la disposition
# système — fr, donc AZERTY, cf. /etc/X11/xorg.conf.d/00-keyboard.conf écrit par
# localectl — et le mot de passe se saisit en AZERTY sur un clavier ergol.
#
# Il reproduit à l'identique les règles hl.device() de hypr/userprefs.lua, pour
# que ces claviers se comportent pareil avant et après l'ouverture de session.
#
# POURQUOI PAS `localectl set-x11-keymap fr "" ergol`
# Ça basculerait TOUS les claviers en ergol, y compris le clavier classique
# (« Logitech USB Keyboard ») qui doit rester en AZERTY. On cible donc par
# périphérique, exactement comme le fait userprefs.lua côté Hyprland.
#
# LE PRÉFIXE 90- EST SIGNIFICATIF
# Xorg lit /etc/X11/xorg.conf.d/ dans l'ordre lexicographique et les InputClass
# qui matchent se cumulent, les dernières écrasant les précédentes. Sous 00-,
# ces options seraient réécrasées par le « fr » système.
#
# MatchProduct compare par SOUS-CHAÎNE : « Corne » couvre les quatre interfaces
# clavier exposées par le même périphérique (« foostan Corne v4 », « ... Keyboard »,
# « ... Consumer Control », « ... System Control »). MatchIsKeyboard écarte
# l'interface souris du même firmware QMK.
#
# N'a d'effet qu'au (re)démarrage du serveur X, donc au prochain boot ou après un
# redémarrage de sddm.service. Sans effet sur la session Hyprland, qui est en
# Wayland et tient sa disposition de sa propre config.

Section "InputClass"
    Identifier "corne-ergol"
    MatchIsKeyboard "on"
    MatchProduct "Corne"
    Option "XkbLayout" "fr"
    Option "XkbVariant" "ergol"
EndSection

Section "InputClass"
    Identifier "sofle-ergol"
    MatchIsKeyboard "on"
    MatchProduct "Sofle"
    Option "XkbLayout" "fr"
    Option "XkbVariant" "ergol"
EndSection
