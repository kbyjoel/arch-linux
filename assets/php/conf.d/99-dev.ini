; Extensions PHP activées pour l'outillage de développement côté hôte.
; Déployé par install.sh vers /etc/php/conf.d/ (copié et pas symlinké : ce
; répertoire est lu en root, et on ne veut pas qu'un lien vers le home casse
; php pour les autres utilisateurs).
;
; POURQUOI CE FICHIER EXISTE : sur Arch, le paquet `php` livre bien ces
; extensions (/usr/lib/php/modules/*.so) mais les laisse commentées dans
; /etc/php/php.ini. Un `pacman -S php` seul ne suffit donc pas — sans ce
; drop-in, composer refuse d'installer les dépendances des projets qui
; déclarent ext-iconv/ext-soap, et phpactor n'indexe rien.
;
; On passe par conf.d plutôt que par une édition de php.ini pour rester
; idempotent : php.ini appartient au paquet et serait écrasé/mis en .pacnew à
; chaque mise à jour de PHP. Le préfixe 99 garantit qu'on est chargé en
; dernier (les fichiers de conf.d sont lus par ordre alphabétique).
;
; Pour en ajouter une : vérifie d'abord qu'elle est fournie par le paquet de
; base (`pacman -Ql php | grep <nom>.so`) ; sinon il faut le paquet dédié
; (php-gd, php-sodium, php-sqlite, php-pgsql, php-apcu…) à déclarer en plus
; dans packages/pacman.txt.

; iconv : exigé explicitement (ext-iconv) par applications/frontend de
; monorepo ; composer bloque l'install sans lui.
extension=iconv

; soap : exigé (ext-soap) par les apps qui parlent aux web services billetterie.
extension=soap

; intl : pas listé en ext-* mais réclamé par symfony/intl et Twig dès qu'on
; formate dates, nombres ou devises. Symfony affiche un avertissement de
; requirements sans lui.
extension=intl
