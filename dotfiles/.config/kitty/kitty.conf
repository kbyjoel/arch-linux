# Config kitty reprise de HyDE (github.com/hyde-project/hyde), adaptée :
# - police CaskaydiaCove -> JetBrainsMono Nerd Font Mono (celle déjà installée)
# - couleurs déportées dans theme.conf (remplaçable pour changer de palette)

font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

enable_audio_bell   no
window_padding_width 25
cursor_trail        1

# Barre d'onglets (style powerline, comme HyDE)
tab_bar_edge        bottom
tab_bar_style       powerline
tab_powerline_style slanted
tab_title_template  {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

# Couleurs (le thème peut surcharger n'importe quel réglage ci-dessus)
include theme.conf

# Décommenter au besoin :
# background_opacity 0.85
# hide_window_decorations yes
# confirm_os_window_close 0
