# hyprlock — écran de verrouillage assorti au login SDDM (thème silent / rei).
#
# But : SUPER+L (ou le bouton « Verrouiller » de wlogout) verrouille la session
# en gardant toutes les apps ouvertes, avec la VIDÉO du chat en fond animé.
# hyprlock ne lit pas de vidéo : le fond ci-dessous est donc TRANSPARENT, et le
# script `screenlock` (~/.local/bin) joue cat.mp4 via mpvpaper sur la couche
# overlay, par-dessus. Nécessite misc:session_lock_xray = true côté Hyprland.
# Ne lance pas `hyprlock` directement (fond noir) — passe par `screenlock`.
# (Verrou ≠ déconnexion : ici rien n'est fermé.)

background {
    monitor =
    color = rgba(0, 0, 0, 0)
    blur_passes = 0
}

# Grande horloge violette (comme le [LockScreen] du thème silent)
label {
    monitor =
    text = $TIME
    color = rgb(C3C6FB)
    font_size = 110
    font_family = Red Hat Display
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.6)
    shadow_boost = 1.2
    position = 0, 220
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A %d %B %Y"
    color = rgb(C3C6FB)
    font_size = 22
    font_family = Red Hat Display
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.6)
    position = 0, 120
    halign = center
    valign = center
}

# Champ mot de passe assorti (bordure violette, fond noir), même palette que le login
input-field {
    monitor =
    size = 240, 42
    rounding = 10
    outline_thickness = 2
    dots_size = 0.3
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgb(C3C6FB)
    inner_color = rgb(000000)
    font_color = rgb(C3C6FB)
    font_family = Red Hat Display
    fade_on_empty = false
    placeholder_text = <span foreground="##C3C6FB">Mot de passe</span>
    check_color = rgb(8C90C2)
    fail_color = rgb(FF5555)
    # Calé à gauche : halign=left ancre au bord gauche, position X = marge depuis
    # ce bord (comme le [LoginScreen.LoginArea] position="left" du thème silent).
    position = 80, 0
    halign = left
    valign = center
}
