# hypridle — démon d'inactivité de Hyprland.
# Doc : https://wiki.hypr.land/Hypr-Ecosystem/hypridle/
#
# Adapté des listeners de HyDE, avec des délais nettement rallongés (HyDE
# tamise à 1 min et suspend à 8 min, beaucoup trop court pour un poste de
# travail : on décroche du clavier bien plus longtemps que ça en réunion).
#
# Lancé au démarrage par hyprland.lua (bloc AUTOSTART).
#
# Deux rôles :
#   1. les hooks de veille — rabattre le couvercle verrouille la session ;
#   2. les listeners ci-dessous — enchaînement sur inactivité.
#
# Chaîne au rabat du couvercle :
#   logind détecte le couvercle (HandleLidSwitch=suspend, valeur par défaut,
#   aucun réglage à faire) -> il annonce la veille sur D-Bus -> hypridle
#   exécute before_sleep_cmd -> session verrouillée -> veille.
# À la réouverture, on retrouve donc hyprlock et non le bureau.

general {
    # Verrouille via logind (le script fait le `loginctl lock-session`), ce qui
    # déclenche le lock_cmd ci-dessous. Du coup `loginctl lock-session` lancé à
    # la main verrouille aussi, pas seulement la veille.
    #
    # Le script — et non la commande directe — parce que `loginctl lock-session`
    # rend la main aussitôt : hypridle relâcherait son inhibiteur avant que le
    # verrou soit à l'écran, et on verrait le bureau une seconde ou deux au
    # réveil. Le script bloque jusqu'à l'affichage effectif de hyprlock.
    before_sleep_cmd = lock-before-sleep

    # Le verrou lui-même : notre script, pas `hyprlock` nu — c'est lui qui
    # lance la vidéo du chat en fond via mpvpaper (voir ~/.local/bin/screenlock).
    # Le script sort déjà tout seul si hyprlock tourne, mais on garde le garde-fou.
    lock_cmd = pidof hyprlock || screenlock

    # Respecte les demandes d'inhibition : une vidéo en plein écran dans Chrome
    # ou un appel Teams empêchent donc l'écran de se tamiser puis de suspendre.
    # C'est bien ce qu'on veut — ne pas passer à true.
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false

    # Pas de after_sleep_cmd : Hyprland rallume l'écran seul au réveil. Le
    # dispatcher DPMS n'est ajouté ici que si un écran noir apparaît au retour
    # de veille — et sa signature Lua est à établir hors session (voir la note
    # sur le DPMS plus bas).
}

# --- 10 min : tamise l'écran ---------------------------------------------
# Sert d'avertissement visuel avant le verrouillage : un mouvement de souris
# suffit à revenir en arrière. `-s` mémorise la luminosité, `-r` la restaure.
listener {
    timeout = 600
    on-timeout = brightnessctl -s set 1%
    on-resume  = brightnessctl -r
}

# --- 15 min : verrouille --------------------------------------------------
# Passe par logind pour déclencher le lock_cmd défini plus haut, plutôt que
# d'appeler `screenlock` en double.
listener {
    timeout = 900
    on-timeout = loginctl lock-session
}

# --- 25 min : met en veille ----------------------------------------------
# La session est déjà verrouillée depuis 10 min à ce stade : au réveil on
# tombe donc sur hyprlock, jamais sur le bureau.
listener {
    timeout = 1500
    on-timeout = systemctl suspend
}

# Note : HyDE a un quatrième listener qui coupe l'écran (DPMS) entre le
# verrouillage et la veille, avec `hyprctl dispatch dpms off`. Cette syntaxe
# est celle du format .conf et ÉCHOUE sur une config Lua — et l'équivalent Lua
# n'est documenté nulle part (le stub /usr/share/hypr/stubs/hl.meta.lua ne
# déclare que `dpms fun(...)`, sans types). Il est donc volontairement absent :
# la veille éteint l'écran de toute façon, le DPMS ne ferait gagner que les
# 10 min entre le verrou et la veille. Ne PAS chercher la bonne syntaxe en
# tapant `hyprctl dispatch` sur la session en cours : un mauvais argument
# éteint l'écran.
